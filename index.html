<style>
:root { --line: rgba(255,255,255,.1); --line2: rgba(255,255,255,.18); --mute: rgba(255,255,255,.58); --dim: rgba(255,255,255,.36);
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; color: #f4f4f6; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
body { overflow: hidden; user-select: none; -webkit-user-select: none; }
button, input { font: inherit; color: inherit; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.amb { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.amb::before { content: ''; position: absolute; width: 520px; height: 520px; left: -200px; top: -240px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); filter: blur(40px); }

(function () {
  const c = $('#fx'), x = c.getContext('2d'); let W, H, ps = [];
  function rs() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); ps = Array.from({ length: Math.round(W * H / 9000) }, mk); }
  function mk() { return { x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + .4, vy: -(Math.random() * .25 + .05), vx: (Math.random() - .5) * .1, a: Math.random() * .6 + .2, t: Math.random() * 6 }; }
  function f() {
    if (document.hidden) return requestAnimationFrame(f);
    x.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.t += .02; if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      const al = p.a * (.65 + .35 * Math.sin(p.t)), g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      g.addColorStop(0, `rgba(255,255,255,${al})`); g.addColorStop(.3, `rgba(255,255,255,${al * .3})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, p.r * 6, 0, 7); x.fill();
    }
    requestAnimationFrame(f);
  }
  addEventListener('resize', rs); rs(); f();
})();

const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('rewind', 1); r.onupgradeneeded = () => r.result.createObjectStore('saved', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('saved', mode); const st = t.objectStore('saved'); const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); };
  return {
    all: () => tx('readonly', s => s.getAll()),
    put: v => tx('readwrite', s => s.put(v)),
    del: id => tx('readwrite', s => s.delete(id)),
  };
})();

let clips = [], meta = null, saved = [], tab = 'clips', user = null, FB = null;
const thumbCache = new Map(), blobCache = new Map();
const pad = i => String(i).padStart(4, '0');
async function thumbFor(c) {
  if (c.thumbUrl) return c.thumbUrl;
  if (thumbCache.has(c.id)) return thumbCache.get(c.id);
  if (!FB || !c.hasThumb) return '';
  const p = (async () => {
    try { const d = await FB.F.getDoc(FB.F.doc(FB.db, 'users', FB.uid, 'thumbs', c.id)); if (!d.exists()) return ''; return URL.createObjectURL(new Blob([d.data().data.toUint8Array()], { type: 'image/jpeg' })); }
    catch { return ''; }
  })();
  thumbCache.set(c.id, p); return p;
}
async function loadThumbs(root) {
  root.querySelectorAll('[data-th]').forEach(async el => {
    const c = clips.find(x => x.id === el.dataset.th); if (!c) return;
    const u = await thumbFor(c); if (u) el.style.backgroundImage = `url('${u}')`;
  });
}
// download the phone version (stored in ~900-KB pieces in Firestore)
const inflight = new Map();
function downloadClip(c, onP) {
  if (blobCache.has(c.id)) { onP && onP(1); return Promise.resolve(blobCache.get(c.id)); }
  let job = inflight.get(c.id);
  if (!job) {
    job = { ls: new Set(), p: 0 };
    job.promise = fetchClip(c, p => { job.p = p; job.ls.forEach(f => f(p)); }).finally(() => inflight.delete(c.id));
    inflight.set(c.id, job);
  }
  if (onP) { job.ls.add(onP); onP(job.p); }
  return job.promise;
}
async function fetchClip(c, onP) {
  let blob;
  if (c.videoUrl) { // demo / old format
    const r = await fetch(c.videoUrl); if (!r.ok) throw new Error('Download fehlgeschlagen'); blob = await r.blob();
  } else {
    const n = c.parts || 0, out = new Array(n); let done = 0;
    if (!n) throw new Error('Dieser Clip hat kein Handy-Video (alte Version) – am PC „Aufs Handy laden“ drücken');
    const idx = [...Array(n).keys()];
    await Promise.all(Array.from({ length: Math.min(6, n) }, async () => {
      while (idx.length) {
        const i = idx.shift();
        let d, err;
        for (let t = 0; t < 3 && !d; t++) {
          try { d = await FB.F.getDocFromServer(FB.F.doc(FB.db, 'users', FB.uid, 'clips', c.id, 'parts', pad(i))); }
          catch (e) { err = e; await new Promise(r => setTimeout(r, 800 * (t + 1))); }
        }
        if (!d) throw new Error(err && err.code === 'permission-denied' ? 'Keine Berechtigung – Firestore-Regeln prüfen' : 'Laden fehlgeschlagen: ' + ((err && (err.code || err.message)) || 'unbekannt'));
        if (!d.exists()) throw new Error('Clip ist nicht mehr in der Cloud');
        out[i] = d.data().data.toUint8Array(); done++; onP && onP(done / n);
      }
    }));
    blob = new Blob(out, { type: 'video/mp4' });
  }
  blobCache.set(c.id, blob);
  if (blobCache.size > 3) blobCache.delete(blobCache.keys().next().value);
  return blob;
}

function soonDeleted() {
  // oldest cloud clips that will be removed when the next clip arrives
  if (!meta || !clips.length) return new Set();
  const used = meta.usedBytes || clips.reduce((a, c) => a + (c.bytes || 0), 0), limit = meta.limitBytes || (CONFIG ? CONFIG.limitGB * 1e9 : 9e9);
  const avg = clips.reduce((a, c) => a + (c.bytes || 0), 0) / clips.length || 0;
  const out = new Set(); let free = limit - used;
  const old = [...clips].sort((a, b) => a.created - b.created);
  for (const c of old) { if (free >= avg) break; out.add(c.id); free += c.bytes || 0; }
  return out;
}

  const db = F.initializeFirestore(fapp, { localCache: F.memoryLocalCache() });
  let unsub = [];
  $('#lform').onsubmit = async e => {
    e.preventDefault(); $('#lerr').textContent = ''; $('#lbtn').innerHTML = '<div class="spin"></div>';
    try { await A.signInWithEmailAndPassword(auth, $('#lmail').value.trim(), $('#lpw').value); }
    catch (err) { $('#lerr').textContent = /invalid|wrong|not-found/i.test(err.code || '') ? 'E-Mail oder Passwort falsch' : (err.code || err.message); }
    $('#lbtn').textContent = 'Anmelden';
  };
  
  A.onAuthStateChanged(auth, u => {
    unsub.forEach(f => f()); unsub = [];
    user = u;
    if (!u) { FB = null; return showLogin(); }
    FB = { F, db, uid: u.uid, signOut: () => A.signOut(auth) };
    $('#spTxt').textContent = 'Clips werden geladen …';
    showApp();
    unsub.push(F.onSnapshot(F.query(F.collection(db, 'users', u.uid, 'clips'), F.orderBy('created', 'desc')), snap => {
      const before = new Set(clips.map(c => c.id));
      clips = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const fresh = clips.filter(c => !before.has(c.id));
      if (before.size && fresh.length) toast('Neuer Clip: ' + fresh[0].title);
      render(); renderUsage(); hideSplash();
    }, err => toast('Firestore: ' + (err.code || err.message))));
    unsub.push(F.onSnapshot(F.doc(db, 'users', u.uid, 'meta', 'cloud'), d => { meta = d.exists() ? d.data() : null; renderUsage(); if (tab === 'clips') render(); }));
  });
})();
</script>
</body></html>

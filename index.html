  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></svg>',
  rewind: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 6.5v11L3.6 12z"/><path d="M20.4 6.5v11L12.5 12z" opacity=".7"/></svg>',
};
const I = n => IC[n] || IC.dot;
const GOLD = new Set(['victory', 'crown']);
function fmtT(s) { s = Math.max(0, s || 0); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
function fmtMB(b) { return b >= 1e9 ? (b / 1e9).toFixed(1).replace('.', ',') + ' GB' : Math.max(1, Math.round(b / 1e6)) + ' MB'; }
function fmtDate(ts) {
  const d = new Date(ts), n = new Date(), y = new Date(n); y.setDate(n.getDate() - 1);
  const hm = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === n.toDateString()) return 'Heute, ' + hm;
  if (d.toDateString() === y.toDateString()) return 'Gestern, ' + hm;
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ', ' + hm;
}
function toast(m, ms = 2600) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }

// ---------- particles ----------
(function () {
  const c = $('#fx'), x = c.getContext('2d'); let W, H, ps = [];
  function rs() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); ps = Array.from({ length: Math.round(W * H / 9000) }, mk); }
  function mk() { return { x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + .4, vy: -(Math.random() * .25 + .05), vx: (Math.random() - .5) * .1, a: Math.random() * .6 + .2, t: Math.random() * 6 }; }
  function f() {
    if (document.hidden) return requestAnimationFrame(f);
    x.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.t += .02; if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      const al = p.a * (.65 + .35 * Math.sin(p.t)), g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      g.addColorStop(0, `rgba(255,255,255,${al})`); g.addColorStop(.3, `rgba(255,255,255,${al * .3})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, p.r * 6, 0, 7); x.fill();
    }
    requestAnimationFrame(f);
  }
  addEventListener('resize', rs); rs(); f();
})();

// ---------- local "Gesichert" storage (IndexedDB) ----------
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('rewind', 1); r.onupgradeneeded = () => r.result.createObjectStore('saved', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('saved', mode); const st = t.objectStore('saved'); const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); };
  return {
    all: () => tx('readonly', s => s.getAll()),
    put: v => tx('readwrite', s => s.put(v)),
    del: id => tx('readwrite', s => s.delete(id)),
  };
})();

// ---------- state ----------
let clips = [], meta = null, saved = [], tab = 'clips', user = null, FB = null;
const thumbCache = new Map(), blobCache = new Map();
const pad = i => String(i).padStart(4, '0');
async function thumbFor(c) {
  if (c.thumbUrl) return c.thumbUrl;
  if (thumbCache.has(c.id)) return thumbCache.get(c.id);
  if (!FB || !c.hasThumb) return '';
  const p = (async () => {
    try { const d = await FB.F.getDoc(FB.F.doc(FB.db, 'users', FB.uid, 'thumbs', c.id)); if (!d.exists()) return ''; return URL.createObjectURL(new Blob([d.data().data.toUint8Array()], { type: 'image/jpeg' })); }
    catch { return ''; }
  })();
  thumbCache.set(c.id, p); return p;
}
async function loadThumbs(root) {
  root.querySelectorAll('[data-th]').forEach(async el => {
    const c = clips.find(x => x.id === el.dataset.th); if (!c) return;
    const u = await thumbFor(c); if (u) el.style.backgroundImage = `url('${u}')`;
  });
}
// download the phone version (stored in ~900-KB pieces in Firestore)
async function downloadClip(c, onP) {
  if (blobCache.has(c.id)) return blobCache.get(c.id);
  let blob;
  if (c.videoUrl) { // demo / old format
    const r = await fetch(c.videoUrl); if (!r.ok) throw new Error('Download fehlgeschlagen'); blob = await r.blob();
  } else {
    const n = c.parts || 0, out = new Array(n); let done = 0;
    const idx = [...Array(n).keys()];
    await Promise.all(Array.from({ length: Math.min(6, n) }, async () => {
      while (idx.length) {
        const i = idx.shift();
        const d = await FB.F.getDoc(FB.F.doc(FB.db, 'users', FB.uid, 'clips', c.id, 'parts', pad(i)));
        if (!d.exists()) throw new Error('Clip ist nicht mehr in der Cloud');
        out[i] = d.data().data.toUint8Array(); done++; onP && onP(done / n);
      }
    }));
    blob = new Blob(out, { type: 'video/mp4' });
  }
  blobCache.set(c.id, blob);
  if (blobCache.size > 3) blobCache.delete(blobCache.keys().next().value);
  return blob;
}

function soonDeleted() {
  // oldest cloud clips that will be removed when the next clip arrives
  if (!meta || !clips.length) return new Set();
  const used = meta.usedBytes || clips.reduce((a, c) => a + (c.bytes || 0), 0), limit = meta.limitBytes || (CONFIG ? CONFIG.limitGB * 1e9 : 9e9);
  const avg = clips.reduce((a, c) => a + (c.bytes || 0), 0) / clips.length || 0;
  const out = new Set(); let free = limit - used;
  const old = [...clips].sort((a, b) => a.created - b.created);
  for (const c of old) { if (free >= avg) break; out.add(c.id); free += c.bytes || 0; }
  return out;
}

function badges(c) {
  const ev = c.events || [], by = t => ev.filter(e => e.type === t).length, out = [];
  if (by('victory')) out.push(`<span class="bd gold">${I('crown')}</span>`);
  if (by('elim')) out.push(`<span class="bd">${I('target')}${by('elim')}</span>`); else if (by('knock')) out.push(`<span class="bd">${I('bolt')}${by('knock')}</span>`);
  const seen = new Set(['victory', 'elim', 'knock', 'death', 'knockedby']);
  for (const e of ev) { if (seen.has(e.type) || out.length >= 4) continue; seen.add(e.type); out.push(`<span class="bd">${I(e.icon)}</span>`); }
  return out.join('');
}

function render() {
  $('#nClips').textContent = clips.length; $('#nSaved').textContent = saved.length;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const sc = $('#scroll');
  const savedIds = new Set(saved.map(s => s.id));
  if (tab === 'clips') {
    const soon = soonDeleted();
    sc.innerHTML = `<div class="h2"><b>Clips</b><span>${clips.length} in der Cloud</span></div>` + (clips.length ? clips.map((c, i) => `
      <div class="card" data-id="${esc(c.id)}" style="animation-delay:${Math.min(i, 10) * 40}ms">
        <div class="th" data-th="${esc(c.id)}" style="background-image:url('${esc(c.thumbUrl || '')}')">
          <div class="badges">${badges(c)}</div>
          <div class="tr">${savedIds.has(c.id) ? `<span class="bd">${I('saved')}</span>` : ''}</div>
          <div class="pl">${I('play')}</div>
          <div class="game">${esc(c.game || '')}</div><div class="dur">${fmtT(c.duration)}</div>
        </div>
        <div class="meta"><b>${esc(c.title)}</b><span>${fmtDate(c.created)} · ${fmtMB(c.videoBytes || c.bytes || 0)}</span></div>
        ${soon.has(c.id) && !savedIds.has(c.id) ? `<div class="warn">${I('clock')}Wird bald aus der Cloud gelöscht – jetzt sichern</div>` : ''}
      </div>`).join('') : `<div class="empty"><div class="ic">${I('rewind')}</div><h3>Noch keine Clips</h3>Drück am PC <b>F8</b> – der Clip erscheint hier automatisch.</div>`);
  } else {
    sc.innerHTML = `<div class="h2"><b>Gesichert</b><span>auf diesem Handy · offline</span></div>` + (saved.length ? saved.map((s, i) => `
      <div class="card" data-saved="${esc(s.id)}" style="animation-delay:${Math.min(i, 10) * 40}ms">
        <div class="th" style="background-image:url('${s.thumbUrl ? esc(s.thumbUrl) : ''}')">
          <div class="badges">${badges(s.meta)}</div><div class="tr"><span class="bd">${I('saved')}</span></div>
          <div class="pl">${I('play')}</div><div class="game">${esc(s.meta.game || '')}</div><div class="dur">${fmtT(s.meta.duration)}</div>
        </div>
        <div class="meta"><b>${esc(s.meta.title)}</b><span>${fmtDate(s.meta.created)} · ${fmtMB(s.blob.size)}</span></div>
      </div>`).join('') : `<div class="empty"><div class="ic">${I('save')}</div><h3>Nichts gesichert</h3>Öffne einen Clip und tippe auf <b>Sichern</b>. Er bleibt dann hier, auch wenn er aus der Cloud gelöscht wird.</div>`);
  }
  loadThumbs(sc);
  sc.querySelectorAll('[data-id]').forEach(el => el.onclick = () => openClip(clips.find(c => c.id === el.dataset.id), null));
  sc.querySelectorAll('[data-saved]').forEach(el => el.onclick = () => { const s = saved.find(x => x.id === el.dataset.saved); openClip(s.meta, s); });
}
function renderUsage() {
  const u = $('#usage');
  if (!meta) { u.hidden = true; return; }
  const p = Math.min(1, (meta.usedBytes || 0) / (meta.limitBytes || 1)), C = 2 * Math.PI * 11;
  u.hidden = false;
  u.innerHTML = `<svg class="ring" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="3"/><circle cx="14" cy="14" r="11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" style="filter:drop-shadow(0 0 4px #fff)"/></svg><div>${Math.round(p * 100)}%<br><small>Cloud</small></div>`;
  $('#mStore').innerHTML = `Cloud: <b style="display:inline">${fmtMB(meta.usedBytes || 0)}</b> von ${fmtMB(meta.limitBytes || 0)}`;
}
async function loadSaved() {
  saved = (await idb.all().catch(() => [])) || [];
  for (const s of saved) { if (s.thumb && !s.thumbUrl) s.thumbUrl = URL.createObjectURL(s.thumb); }
  saved.sort((a, b) => b.meta.created - a.meta.created);
}

// ---------- player ----------
let objUrl = null;
function openClip(c, local) {
  if (!c) return;
  const sh = $('#sheet');
  if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; }
  const src = local ? (objUrl = URL.createObjectURL(local.blob)) : '';
  const evs = [...(c.events || [])].sort((a, b) => a.at - b.at);
  const isSaved = !!saved.find(s => s.id === c.id);
  sh.innerHTML = `
    <div class="sh-top"><button class="xb" id="shx">${I('close')}</button><div class="tt"><b>${esc(c.title)}</b><span>${esc(c.game || '')}${c.game ? ' · ' : ''}${fmtDate(c.created)}</span></div></div>
    <div class="vwrap"><video id="v" ${src ? `src="${esc(src)}"` : ''} playsinline webkit-playsinline preload="metadata"></video>${src ? '' : `<div class="vload" id="vl"><div class="ring2"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="5"/><circle id="vlc" cx="32" cy="32" r="27" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6" style="filter:drop-shadow(0 0 6px #fff);transition:stroke-dashoffset .2s"/></svg></div><span id="vlt">Lädt …</span></div>`}<div class="flash" id="fl"><i></i><span></span></div></div>
    <div class="sh-body">
      <div class="ctl"><button class="pp" id="pp">${I('play')}</button><div class="time"><b id="tc">0:00</b> / ${fmtT(c.duration)}</div></div>
      <div class="track" id="tk"><div class="rail"><div class="fill" id="fi"></div></div>
        ${evs.map((e, i) => `<div class="mk ${GOLD.has(e.type) ? 'gold' : ''}" data-i="${i}" style="left:${(e.at / c.duration * 100).toFixed(2)}%"><i>${I(e.icon)}</i></div>`).join('')}
        <div class="head" id="hd" style="left:0"></div></div>
      <div class="evs">${evs.map((e, i) => `<div class="ev" data-i="${i}"><i>${I(e.icon)}</i>${esc(e.label)}<time>${fmtT(e.at)}</time></div>`).join('')}</div>
      <div class="acts">
        ${local ? `<button class="btn" id="unsave">${I('trash')}Entfernen</button>` : `<button class="btn prog" id="save"><div class="bar" style="width:0"></div><span>${isSaved ? I('saved') + 'Gesichert' : I('save') + 'Sichern'}</span></button>`}
        <button class="btn primary prog" id="photos"><div class="bar" style="width:0"></div><span>${I('photos')}In Fotos</span></button>
      </div>
      <div class="note"><b>Sichern</b> behält den Clip in der App, auch wenn er aus der Cloud gelöscht wird. <b>In Fotos</b> öffnet das Teilen-Menü – dort „Video sichern“ tippen.</div>
    </div>`;
  requestAnimationFrame(() => sh.classList.add('on'));
  const v = $('#v'), tk = $('#tk');
  (async () => {
    const pu = local ? local.thumbUrl : await thumbFor(c); if (pu) v.poster = pu;
    if (!local) {
      try {
        const b = await downloadClip(c, p => { const e = $('#vlc'); if (e) e.style.strokeDashoffset = 169.6 * (1 - p); const t = $('#vlt'); if (t) t.textContent = 'Lädt ' + Math.round(p * 100) + ' %'; });
        if (!sh.classList.contains('on')) return;
        objUrl = URL.createObjectURL(b); v.src = objUrl; const l = $('#vl'); if (l) l.remove();
      } catch (e) { const t = $('#vlt'); if (t) t.textContent = e.message; }
    }
  })();
  const dur = () => (isFinite(v.duration) && v.duration > 0 ? v.duration : c.duration);
  const seek = t => { v.currentTime = Math.max(0, Math.min(dur() - .05, t)); };
  $('#shx').onclick = () => { v.pause(); sh.classList.remove('on'); };
  $('#pp').onclick = () => v.paused ? v.play() : v.pause();
  v.onplay = () => $('#pp').innerHTML = I('pause'); v.onpause = () => $('#pp').innerHTML = I('play');
  let lastF = -1;
  v.ontimeupdate = () => {
    const p = v.currentTime / dur() * 100; $('#fi').style.width = p + '%'; $('#hd').style.left = p + '%'; $('#tc').textContent = fmtT(v.currentTime);
    sh.querySelectorAll('.mk').forEach(m => m.classList.toggle('near', Math.abs(evs[m.dataset.i].at - v.currentTime) < .8));
    const h = evs.findIndex(e => v.currentTime >= e.at && v.currentTime < e.at + 2.2);
    if (h >= 0 && h !== lastF && !v.paused) { lastF = h; const f = $('#fl'); f.querySelector('i').innerHTML = I(evs[h].icon); f.querySelector('span').textContent = evs[h].label; f.classList.add('on'); clearTimeout(f._h); f._h = setTimeout(() => f.classList.remove('on'), 1800); }
    if (h < 0) lastF = -1;
  };
  const pos = e => { const r = tk.getBoundingClientRect(), x = (e.touches ? e.touches[0] : e).clientX; return Math.max(0, Math.min(1, (x - r.left) / r.width)) * dur(); };
  let drag = false;
  tk.addEventListener('pointerdown', e => { if (e.target.closest('.mk')) return; drag = true; seek(pos(e)); });
  window.onpointermove = e => { if (drag) seek(pos(e)); };
  window.onpointerup = () => { drag = false; };
  const jump = i => { seek(Math.max(0, evs[i].at - 2)); v.play(); };
  sh.querySelectorAll('[data-i]').forEach(m => m.onclick = () => jump(+m.dataset.i));

  const progBtn = (btn, p) => { btn.querySelector('.bar').style.width = Math.round(p * 100) + '%'; };
  async function getBlob(btn) {
    if (local) return local.blob;
    const have = saved.find(s => s.id === c.id); if (have) return have.blob;
    return downloadClip(c, p => progBtn(btn, p));
  }
  const sv = $('#save');
  if (sv) sv.onclick = async () => {
    if (saved.find(s => s.id === c.id)) return toast('Schon gesichert');
    sv.disabled = true;
    try {
      const blob = await getBlob(sv);
      let thumb = null; try { const tu = await thumbFor(c); if (tu) { const t = await fetch(tu); if (t.ok) thumb = await t.blob(); } } catch {}
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      await idb.put({ id: c.id, meta: c, blob, thumb, savedAt: Date.now() });
      await loadSaved(); render();
      sv.querySelector('span').innerHTML = I('saved') + 'Gesichert'; progBtn(sv, 0); toast('In der App gesichert');
    } catch (e) { toast(String(e.message || e)); progBtn(sv, 0); }
    sv.disabled = false;
  };
  const un = $('#unsave');
  if (un) un.onclick = async () => {
    if (!un.dataset.sure) { un.dataset.sure = 1; un.innerHTML = I('trash') + 'Wirklich?'; return; }
    await idb.del(c.id); await loadSaved(); render(); sh.classList.remove('on'); toast('Entfernt');
  };
  const ph = $('#photos');
  ph.onclick = async () => {
    ph.disabled = true;
    try {
      const blob = await getBlob(ph);
      const name = (c.title || 'Rewind Clip').replace(/[^\w\-äöüÄÖÜß· ]+/g, '').replace(/\s*·\s*/g, ' - ').slice(0, 60) + '.mp4';
      const file = new File([blob], name, { type: 'video/mp4' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Heruntergeladen'); }
    } catch (e) { if (e.name !== 'AbortError') toast(String(e.message || e)); }
    progBtn(ph, 0); ph.disabled = false;
  };
}

// ---------- UI wiring ----------
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); $('#scroll').scrollTop = 0; });
$('#avatar').onclick = () => $('#menu').classList.toggle('on');
document.addEventListener('click', e => { if (!e.target.closest('#menu') && !e.target.closest('#avatar')) $('#menu').classList.remove('on'); });

function showApp() {
  $('#login').hidden = true; $('#app').hidden = false;
  $('#avatar').textContent = (user && user.email ? user.email[0] : 'R').toUpperCase();
  $('#mWho').textContent = user ? user.email : '';
  render(); renderUsage();
}
function showLogin() { $('#app').hidden = true; $('#login').hidden = false; }

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

(async function start() {
  await loadSaved();
  if (DEMO) {
    const d = window.REWIND_DEMO || { clips: [], meta: null };
    clips = d.clips; meta = d.meta; user = { email: 'merlin@beispiel.de' };
    if (d.tab) tab = d.tab;
    if (d.saved) saved = d.saved;
    showApp();
    if (d.open) setTimeout(() => openClip(clips[0], null), 300);
    return;
  }
  if (!CONFIG || !CONFIG.firebase) {
    showLogin(); $('#lform').innerHTML = '<div class="lerr">Diese Handy-App wurde nicht über Rewind am PC exportiert.<br>Einstellungen → Cloud &amp; Handy-App → „Handy-App exportieren“.</div>'; return;
  }
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const fapp = initializeApp(CONFIG.firebase);
  const auth = A.getAuth(fapp);
  await A.setPersistence(auth, A.browserLocalPersistence).catch(() => {});
  const db = F.initializeFirestore(fapp, { localCache: F.persistentLocalCache() });
  let unsub = [];
  $('#lform').onsubmit = async e => {
    e.preventDefault(); $('#lerr').textContent = ''; $('#lbtn').innerHTML = '<div class="spin"></div>';
    try { await A.signInWithEmailAndPassword(auth, $('#lmail').value.trim(), $('#lpw').value); }
    catch (err) { $('#lerr').textContent = /invalid|wrong|not-found/i.test(err.code || '') ? 'E-Mail oder Passwort falsch' : (err.code || err.message); }
    $('#lbtn').textContent = 'Anmelden';
  };
  $('#mOut').onclick = () => { $('#menu').classList.remove('on'); A.signOut(auth); };
  A.onAuthStateChanged(auth, u => {
    unsub.forEach(f => f()); unsub = [];
    user = u;
    if (!u) { FB = null; return showLogin(); }
    FB = { F, db, uid: u.uid };
    showApp();
    unsub.push(F.onSnapshot(F.query(F.collection(db, 'users', u.uid, 'clips'), F.orderBy('created', 'desc')), snap => {
      const before = new Set(clips.map(c => c.id));
      clips = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const fresh = clips.filter(c => !before.has(c.id));
      if (before.size && fresh.length) toast('Neuer Clip: ' + fresh[0].title);
      if (tab === 'clips') render(); else $('#nClips').textContent = clips.length;
    }, err => toast('Firestore: ' + (err.code || err.message))));
    unsub.push(F.onSnapshot(F.doc(db, 'users', u.uid, 'meta', 'cloud'), d => { meta = d.exists() ? d.data() : null; renderUsage(); if (tab === 'clips') render(); }));
  });
})();
</script>
